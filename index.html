<!DOCTYPE html>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>电商工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="电商工作台">
<meta name="theme-color" content="#5B6FFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --c-bg: #F6F7FB;
    --c-card: #FFFFFF;
    --c-text: #1F2937;
    --c-sub: #6B7280;
    --c-line: #E5E7EB;
    --c-brand: #5B6FFF;
    --c-brand-soft: #EEF1FF;
    --c-danger: #DC2626;
    --c-danger-soft: #FEE2E2;
    --c-warn: #F59E0B;
    --c-ok: #16A34A;
    --c-ok-soft: #DCFCE7;
    --c-xhs: #FE2C55;
    --c-taobao: #FF6F00;
    --c-dy: #161823;
    --radius: 14px;
    --radius-sm: 8px;
    --gap: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
    padding-top: env(safe-area-inset-top);
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
  .install-tip {
    background: var(--c-brand-soft); color: var(--c-brand);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
    margin-bottom: 12px; line-height: 1.5;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 0 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--c-xhs), var(--c-taobao));
    display: flex; align-items: center; justify-content: center;
  }
  .sync {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 999px; background: var(--c-card); box-shadow: var(--shadow);
    font-size: 12px; color: var(--c-sub);
  }
  .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-ok); }
  .sync.s-syncing .dot { background: var(--c-warn); animation: pulse 1.2s infinite; }
  .sync.s-off .dot { background: var(--c-danger); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-icon {
    border: 0; background: var(--c-card); box-shadow: var(--shadow);
    width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: var(--c-text);
  }
  .btn-icon:hover { background: var(--c-brand-soft); }
  .btn-text-icon {
    border: 0; background: var(--c-card); box-shadow: var(--shadow);
    padding: 8px 12px; border-radius: 10px; cursor: pointer;
    font: inherit; color: var(--c-text); display: inline-flex; align-items: center; gap: 4px;
  }
  .btn {
    border: 0; background: var(--c-brand); color: #fff;
    padding: 12px 18px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600;
    min-height: 44px;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { background: var(--c-sub); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--c-brand); box-shadow: none; padding: 10px 12px; min-height: 40px; }
  .btn-ghost:hover { background: var(--c-brand-soft); }
  .btn-danger { background: var(--c-danger); }
  .card { background: var(--c-card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  h2 .h2-icon { width: 18px; height: 18px; color: var(--c-brand); }
  h2 .badge { font-size: 11px; color: var(--c-sub); font-weight: normal; }

  /* Top section: today */
  .today-section { margin-bottom: 16px; }
  .today-empty {
    text-align: center; color: var(--c-sub); padding: 28px 12px;
  }
  .today-empty svg { width: 40px; height: 40px; color: var(--c-line); margin-bottom: 6px; }
  .today-tools {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin: 2px 0 8px; min-height: 30px;
  }
  .today-tools .tools-info { font-size: 12px; color: var(--c-sub); }
  .today-tools button {
    font-size: 12px; padding: 6px 12px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--c-line); background: #fff; color: var(--c-sub); cursor: pointer;
  }
  .today-tools button.primary { border-color: var(--c-ok); color: var(--c-ok); }
  .today-tools button.ghost { opacity: .55; }
  .task-row {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border: 1px solid var(--c-line); border-radius: var(--radius-sm); margin-bottom: 8px;
    background: #fff;
  }
  .task-row.overdue { border-color: var(--c-danger); background: var(--c-danger-soft); }
  .task-row.clickable { cursor: pointer; }
  .task-row.clickable:active { background: var(--c-brand-soft); }
  .task-row .plat-badge {
    flex-shrink: 0; padding: 3px 8px; border-radius: 6px; font-size: 11px; color: #fff; font-weight: 600;
  }
  .task-row .plat-badge.xhs { background: var(--c-xhs); }
  .task-row .plat-badge.taobao { background: var(--c-taobao); }
  .task-row .plat-badge.dy { background: var(--c-dy); }
  .task-row .info { flex: 1; min-width: 0; }
  .task-row .name { font-weight: 600; font-size: 14px; word-break: break-word; }
  .task-row .meta { font-size: 12px; color: var(--c-sub); margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-row .meta .progress-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--c-brand-soft); color: var(--c-brand); padding: 2px 6px; border-radius: 4px; font-weight: 600;
  }
  .task-row .meta .overdue-tag {
    background: var(--c-danger); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
  .task-row .actions-cell { flex-shrink: 0; display: flex; gap: 6px; }

  /* 备忘录列表：一条一条（任务台账改版） */
  .memo-list {
    background: var(--c-card); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; margin-bottom: 12px;
  }
  .memo-group-title {
    font-size: 12px; font-weight: 700; color: var(--c-sub);
    padding: 12px 14px 6px; background: var(--c-card); letter-spacing: .3px;
  }
  .memo-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
    border-top: 1px solid var(--c-line); background: var(--c-card); cursor: pointer;
  }
  .memo-row.done { background: #FAFAFA; }
  .memo-row.simple { align-items: center; }
  .memo-row.simple .memo-chev { align-self: center; }
  .memo-row:active { background: var(--c-brand-soft); }
  .memo-check {
    flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px;
    border: 2px solid var(--c-line); border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; color: transparent; cursor: pointer;
  }
  .memo-row.done .memo-check { border-color: var(--c-ok); background: var(--c-ok); color: #fff; }
  .memo-body { flex: 1; min-width: 0; }
  .memo-name { font-size: 15px; font-weight: 500; word-break: break-word; }
  .memo-row.done .memo-name { color: var(--c-sub); text-decoration: line-through; }
  .memo-sub {
    font-size: 12px; color: var(--c-sub); margin-top: 3px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0;
  }
  .memo-sub .memo-note {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .memo-right {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .memo-date { font-size: 12px; color: var(--c-sub); }
  .memo-row { -webkit-touch-callout: none; user-select: none; }
  .memo-chev { font-size: 14px; color: #D1D5DB; line-height: 1; }

  /* 备忘录详情页：全屏只读 + 大图横滑 */
  .memo-detail {
    position: fixed; inset: 0; z-index: 130; background: #fff; display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .memo-detail.show { display: flex; }
  .md-top {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--c-line); background: #fff;
  }
  .md-back { font-size: 15px; color: var(--c-brand); padding: 4px 6px; }
  .md-top-t { font-size: 12px; color: var(--c-sub); }
  .md-del { font-size: 14px; color: var(--c-danger); padding: 6px 8px; }
  .md-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; background: #fff; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); }
  .md-field {
    background: #F7F8FA; border: 1px solid var(--c-line); border-radius: 8px;
    padding: 11px 12px; font-size: 15px; line-height: 1.5; word-break: break-word; white-space: pre-wrap;
  }
  .md-field.md-area { min-height: 96px; }
  .md-field.md-placeholder { color: #B9BDC7; }
  .md-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .md-cell { position: relative; }
  .md-cell img { width: 100%; height: 128px; object-fit: cover; border-radius: 8px; display: block; background: #F2F2F5; }
  .md-hint { margin-top: 8px; font-size: 12px; color: var(--c-sub); }

  /* 点图片后的全屏放大浏览：可左右滑 */
  .zoom-mask {
    position: fixed; inset: 0; z-index: 150; background: #000; display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .zoom-mask.show { display: flex; }
  .zoom-gal {
    flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  }
  .zoom-slide {
    flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-slide img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .zoom-bar { flex: 0 0 auto; padding: 12px calc(12px + env(safe-area-inset-bottom)); text-align: center; }
  .zoom-ctr { display: block; color: #fff; font-size: 13px; margin-bottom: 8px; }
  .zoom-close { display: inline-block; color: #fff; font-size: 15px; padding: 8px 24px; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; }
  .status-pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .status-pill.s-未开始 { background: #F3F4F6; color: var(--c-sub); }
  .status-pill.s-进行中 { background: var(--c-brand-soft); color: var(--c-brand); }
  .status-pill.s-已完成 { background: var(--c-ok-soft); color: var(--c-ok); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--c-card); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 8px; cursor: pointer; font: inherit;
    color: var(--c-sub); min-height: 44px;
  }
  .tabs button.active { background: var(--c-brand); color: #fff; font-weight: 600; }

  /* Tasks list */
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-pill {
    border: 1px solid var(--c-line); background: #fff; padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit;
    min-height: 36px; color: var(--c-text);
  }
  .filter-pill.active { background: var(--c-brand); color: #fff; border-color: var(--c-brand); }
  .task-list .card-item {
    background: #fff; border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 10px;
    border: 1px solid transparent;
  }
  .task-list .card-item.is-sample { border-style: dashed; border-color: var(--c-warn); }
  .card-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-item-head .title { font-weight: 700; font-size: 15px; word-break: break-word; }
  .card-item-head .meta-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .progress-block { margin: 8px 0; }
  .progress-block .pt { display: flex; justify-content: space-between; font-size: 12px; color: var(--c-sub); margin-bottom: 4px; }
  .progress-bar { width: 100%; height: 8px; background: var(--c-line); border-radius: 999px; overflow: hidden; }
  .progress-bar .pf { height: 100%; background: var(--c-brand); transition: width .3s; }
  .progress-bar .pf.ok { background: var(--c-ok); }
  .progress-row { display: flex; align-items: center; gap: 8px; }
  .progress-row input[type=range] { flex: 1; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12px; color: var(--c-sub); }
  .note { margin-top: 8px; color: var(--c-sub); font-size: 13px; word-break: break-word; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs .thumb { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: var(--c-bg); cursor: pointer; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs .thumb .x {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .thumbs .add-img {
    width: 64px; height: 64px; border-radius: 8px; border: 2px dashed var(--c-line);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--c-sub); background: #fff;
  }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; }
  .card-actions button { flex: 1; }

  /* Week report */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-card { text-align: center; padding: 12px 4px; border-radius: var(--radius-sm); background: var(--c-brand-soft); }
  .stat-card .num { font-size: 22px; font-weight: 700; color: var(--c-brand); line-height: 1.2; }
  .stat-card .lbl { font-size: 11px; color: var(--c-sub); margin-top: 2px; }
  .plat-stats { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .plat-row { background: #fff; border-radius: var(--radius-sm); padding: 12px; box-shadow: var(--shadow); }
  .plat-row .pr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .plat-row .pr-name { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .plat-row .pr-stats { font-size: 12px; color: var(--c-sub); }
  .ring-row { display: flex; gap: 12px; align-items: center; }
  .ring-row .ring { flex-shrink: 0; }
  .ring-row .nums { flex: 1; }
  .ring-row .nums .big { font-size: 20px; font-weight: 700; }
  .ring-row .nums .sub { font-size: 12px; color: var(--c-sub); }
  .bar-chart { margin-top: 8px; }
  .bar-chart-title { font-size: 12px; color: var(--c-sub); margin-bottom: 6px; }
  .bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 120px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-col .b { width: 100%; background: var(--c-brand); border-radius: 4px 4px 0 0; min-height: 4px; transition: height .3s; }
  .bar-col .b.ok { background: var(--c-ok); }
  .bar-col .bl { font-size: 11px; color: var(--c-sub); }
  .bar-col .bv { font-size: 10px; color: var(--c-sub); }

  /* Modal */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding: 16px; }
  @media (min-width: 640px) { .modal-mask { align-items: center; } }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: var(--radius); padding: 20px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label { font-size: 12px; color: var(--c-sub); font-weight: 600; }
  .form-row input, .form-row select, .form-row textarea {
    padding: 10px; border: 1px solid var(--c-line); border-radius: 8px; font: inherit; min-height: 44px;
    background: #fff;
  }
  .form-row input[type=range] { padding: 0; min-height: 0; }
  .form-row textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
  .modal-actions button { flex: 1; }

  /* Seed banner */
  .seed-banner {
    background: linear-gradient(135deg, #FFFBEB, #FEF3C7);
    border: 1px solid #FCD34D; border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 12px; color: #92400E; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .seed-banner button { background: transparent; border: 1px solid #F59E0B; color: #92400E; padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }

  /* Bottom tab bar (mobile) */
  .bottom-tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--c-line);
    display: flex; padding: 6px 8px; gap: 4px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .bottom-tabs button {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    padding: 6px 4px; border-radius: 8px; font: inherit; color: var(--c-sub);
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 50px;
  }
  .bottom-tabs button.active { color: var(--c-brand); }
  .bottom-tabs button svg { width: 22px; height: 22px; }
  .bottom-tabs button span { font-size: 11px; }

  /* Floating add button (visible on every tab) */
  .fab {
    position: fixed; left: 16px;
    bottom: calc(74px + env(safe-area-inset-bottom));
    height: 48px; padding: 0 20px; border-radius: 999px;
    border: 0; background: var(--c-brand); color: #fff;
    font-size: 15px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(91,111,255,.4);
    cursor: pointer; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }
  @media (min-width: 640px) { .fab { bottom: 24px; } }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px;
    z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 768px) {
    .bottom-tabs { display: none; }
    body { padding-bottom: 16px; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
    <div class="install-tip" id="installTip" style="display:none">
      📲 想当 APP 用？点浏览器底部「分享」→「添加到主屏幕」，桌面就会多个图标
    </div>
  <!-- Top bar -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </span>
      <span>电商三平台工作台</span>
    </div>
    <div class="actions">
      <button class="btn-text-icon" id="btnExport" title="导出备份">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>导出</span>
      </button>
      <button class="btn-text-icon" id="btnImport" title="导入恢复">

<script>
(function() {
  'use strict';

  // =================== CONFIG ===================
  var DATABASE_ID = '82bWs6P9uAm7KS6dBjcp3f';
  var LS_TASKS = 'wb_ec_tasks_v1';
  var LS_IMG = 'wb_ec_img_v1';
  var LS_SAMPLES = 'wb_ec_samples_v1';
  var LS_SEEDED = 'wb_ec_seeded_v1';
  var LS_HIDDEN = 'wb_ec_today_hidden_v1';
  function lsGetHidden(){ try { return JSON.parse(LS.get(LS_HIDDEN) || '[]'); } catch(e){ return []; } }
  function lsSetHidden(arr){ try { LS.set(LS_HIDDEN, JSON.stringify(arr)); } catch(e){} }

  // 备忘录：独立于任务的记事本，只有名称 + 备注 + 配图
  var LS_MEMOS = 'wb_ec_memos_v1';
  function lsGetMemos(){ try { return JSON.parse(LS.get(LS_MEMOS) || '[]'); } catch(e){ return []; } }
  function lsSetMemos(arr){ try { LS.set(LS_MEMOS, JSON.stringify(arr)); } catch(e){} }

  // 备忘录（原任务台账）自己的「已清走」名单，和今日栏分开
  var LS_MEMO_HIDDEN = 'wb_ec_memo_hidden_v1';
  function lsGetMemoHidden(){ try { return JSON.parse(LS.get(LS_MEMO_HIDDEN) || '[]'); } catch(e){ return []; } }
  function lsSetMemoHidden(arr){ try { LS.set(LS_MEMO_HIDDEN, JSON.stringify(arr)); } catch(e){} }

  // iOS Safari 会禁止第三方 iframe 读写 localStorage，直接访问会抛异常导致整页脚本崩溃。
  // 这里统一走安全壳：能用就用，不能用退化为内存存储（当前会话内有效）。
  var __memStore = {};
  var LS_OK = (function(){
    try { localStorage.setItem('__wb_t', '1'); localStorage.removeItem('__wb_t'); return true; }
    catch (e) { return false; }
  })();
  var LS = {
    get: function(k){
      if (LS_OK) { try { return localStorage.getItem(k); } catch (e) {} }
      return Object.prototype.hasOwnProperty.call(__memStore, k) ? __memStore[k] : null;
    },
    set: function(k, v){
      if (LS_OK) { try { localStorage.setItem(k, v); return; } catch (e) {} }
      __memStore[k] = v;
    },
    remove: function(k){
      if (LS_OK) { try { localStorage.removeItem(k); return; } catch (e) {} }
      delete __memStore[k];
    }
  };

  function lsGetSampleIds(){ try { return JSON.parse(LS.get(LS_SAMPLES) || '[]'); } catch(e){ return []; } }
  function lsSetSampleIds(arr){ try { LS.set(LS_SAMPLES, JSON.stringify(arr)); } catch(e){} }
  function isSampleId(id){ return lsGetSampleIds().indexOf(id) >= 0; }
  var PLATFORMS = ['小红书', '淘宝', '抖音'];
  var STATUSES = ['未开始', '进行中', '已完成'];

  // =================== STATE ===================
  var state = {
    memos: [],          // 备忘录：完全独立，只有 { _id, title, note, createdAt }（配图另存，按 _id 取）
    tasks: [],          // { _id, taskName, platform, status, progress, planDate, note, isSample }
    options: { 平台: {}, 状态: {} },
    currentTab: 'today',
    platformFilter: 'all',
    editingId: null,
    formRecord: null,   // for current modal form
    formImages: [],     // 表单里待保存的配图（dataURL 数组）
    syncing: false
  };

  // =================== DB LAYER ===================
  var db = window.__SMART_PAGE__ && window.__SMART_PAGE__.database;

  function setSync(mode, text) {
    var el = document.getElementById('syncStatus');
    var t = document.getElementById('syncText');
    el.classList.remove('s-syncing', 's-off');
    if (!db) { t.textContent = '本地保存'; return; }
    if (mode === 'syncing') el.classList.add('s-syncing');
    else if (mode === 'off') el.classList.add('s-off');
    t.textContent = text;
  }

  function lsGetTasks() {
    try { return JSON.parse(LS.get(LS_TASKS) || '[]'); }
    catch(e) { return []; }
  }
  function lsSetTasks(arr) { try { LS.set(LS_TASKS, JSON.stringify(arr)); } catch(e) {} }
  function lsGetImgs() {
    try { return JSON.parse(LS.get(LS_IMG) || '{}'); }
    catch(e) { return {}; }
  }
  function lsSetImgs(o) { try { LS.set(LS_IMG, JSON.stringify(o)); } catch(e) {} }

  // Convert server row (Chinese-keyed) to normalized form
  function normalizeRow(r) {
    var idSel = state.options['平台'][r['平台']];
    var stSel = state.options['状态'][r['状态']];
    return {
      _id: r._id,
      taskName: r['任务名称'] || '',
      platform: r['平台'] || '',
      platformId: idSel ? idSel.id : '',
      status: r['状态'] || '未开始',
      statusId: stSel ? stSel.id : '',
      progress: typeof r['完成度'] === 'number' ? r['完成度'] : 0,
      planDate: r['计划日期'] ? r['计划日期'].slice(0, 10) : '',
      note: r['备注'] || '',
      isSample: isSampleId(r._id)
    };
  }

  function denormalize(form) {
    var props = {
      '任务名称': { text: form.taskName || '' },
      '平台':     { select: state.options['平台'][form.platform] ? state.options['平台'][form.platform].id : '' },
      '状态':     { select: state.options['状态'][form.status] ? state.options['状态'][form.status].id : '' },
      '完成度':   { number: Math.max(0, Math.min(100, parseFloat(form.progress) || 0)) },
      '计划日期': { date: form.planDate ? (form.planDate + 'T00:00:00Z') : '1970-01-01T00:00:00Z' },
      '备注':     { text: form.note || '' }
    };
    return props;
  }

  // =================== LOAD/SAVE LAYER ===================
  async function loadOptions() {
    if (db) {
      try {
        var schema = await db.getSchema({ databaseId: DATABASE_ID });
        (schema.properties || []).forEach(function(f) {
          if ((f.type === 'select') && f.config && f.config.options && (f.name === '平台' || f.name === '状态')) {
            var map = {};
            f.config.options.forEach(function(o) { map[o.text] = o; });
            state.options[f.name] = map;
          }
        });
        return true;
      } catch(e) { console.error('[opt]', e); }
    }
    // fallback
    state.options['平台'] = { '小红书':{text:'小红书',id:'78e3cr03w0qox2j8'}, '淘宝':{text:'淘宝',id:'hpwetpyls6quajju'}, '抖音':{text:'抖音',id:'enu8yd5qmk2y97rv'} };
    state.options['状态'] = { '未开始':{text:'未开始',id:'xkp2itlwm687msp1'}, '进行中':{text:'进行中',id:'hy3h2e8s8omrr6yo'}, '已完成':{text:'已完成',id:'vu21f4uvxj8q2ksy'} };
    return false;
  }

  async function loadAll() {
    if (db) {
      setSync('syncing', '同步中...');
      try {
        var result = await db.query({ databaseId: DATABASE_ID, pageSize: 200 });
        var rows = result.results || [];
        state.tasks = rows.map(normalizeRow);
        // cache to localStorage
        lsSetTasks(rows.map(function(r){ return {_id:r._id, raw:r}; }));
        setSync('ok', '已同步');
        return true;
      } catch(e) {
        console.error('[load]', e);
        setSync('off', '离线模式');
        state.tasks = lsGetTasks().map(function(c){ return normalizeRow(c.raw); });
        return false;
      }
    } else {
      setSync('off', '离线模式');
      state.tasks = lsGetTasks().map(function(c){ return normalizeRow(c.raw); });
      return false;
    }
  }

  async function saveRecord(form, id) {
    var props = denormalize(form);
    if (db) {
      setSync('syncing', '同步中...');
      try {
        if (id) {
          await db.updateRecord({ databaseId: DATABASE_ID, recordId: id, properties: props });
        } else {
          var res = await db.addRecord({ databaseId: DATABASE_ID, properties: props });
          id = res.id || (res.result && res.result.id);
          form._id = id;
        }
        setSync('ok', '已同步');
        return id;
      } catch(e) {
        console.error('[save]', e);
        setSync('off', '同步失败');
        // fallthrough to local
      }
    }
    // local fallback
    var cache = lsGetTasks();
    if (id) {
      var idx = cache.findIndex(function(c){ return c._id === id; });
      if (idx >= 0) cache[idx].raw = Object.assign({}, cache[idx].raw, propsToRaw(props));
      else { id = 'loc_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); cache.push({_id:id, raw: Object.assign({_id:id}, propsToRaw(props))}); }
    } else {
      id = 'loc_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      cache.push({_id:id, raw: Object.assign({_id:id}, propsToRaw(props))});
    }
    lsSetTasks(cache);
    return id;
  }

  function propsToRaw(props) {
    return {
      '任务名称': props['任务名称'].text,
      '平台': (function(){
        var id = props['平台'].select;
        var name = '';
        for (var k in state.options['平台']) if (state.options['平台'][k].id === id) { name = k; break; }
        return name;
      })(),
      '状态': (function(){
        var id = props['状态'].select;
        var name = '';
        for (var k in state.options['状态']) if (state.options['状态'][k].id === id) { name = k; break; }
        return name;
      })(),
      '完成度': props['完成度'].number,
      '计划日期': props['计划日期'].date,
      '备注': props['备注'].text
    };
  }

  async function deleteRecord(id) {
    if (db) {
      try {
        await db.deleteRecord({ databaseId: DATABASE_ID, recordId: id });
        setSync('ok', '已同步');
        // also clear cache row
        var cache = lsGetTasks().filter(function(c){ return c._id !== id; });
        lsSetTasks(cache);
        return true;
      } catch(e) { console.error('[del]', e); setSync('off', '同步失败'); }
    }
    var cache = lsGetTasks().filter(function(c){ return c._id !== id; });
    lsSetTasks(cache);
    return false;
  }

  // =================== COMPUTE LAYER ===================
  function todayStr() {
    var d = new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
  }
  function ymd(s) { return s ? s.slice(0,10) : ''; }
  function dayDiff(a, b) {
    // a and b are 'YYYY-MM-DD'; return a - b in days
    var da = new Date(a + 'T00:00:00Z').getTime();
    var db = new Date(b + 'T00:00:00Z').getTime();
    return Math.round((da - db) / 86400000);
  }
  function addDays(s, n) {
    var d = new Date(s + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    var y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), dd = String(d.getUTCDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
  }
  function startOfWeek(s) {
    // ISO week: Monday
    var diff = dayDiff(s, s) % 7; // 0
    // get weekday (0=Sun ... 6=Sat); we want Monday start
    var d = new Date(s + 'T00:00:00Z');
    var wday = d.getUTCDay(); // 0=Sun, 1=Mon, ... 6=Sat
    var back = (wday + 6) % 7; // days back to Monday
    return addDays(s, -back);
  }
  function fmtMD(s) {
    if (!s) return '';
    var p = s.split('-');
    return parseInt(p[1],10) + '月' + parseInt(p[2],10) + '日';
  }
  function wdayCN(s) {
    var d = new Date(s + 'T00:00:00Z').getUTCDay();
    return ['日','一','二','三','四','五','六'][d];
  }

  // 今日任务的排序：抖音 → 小红书 → 淘宝，其它平台排最后
  var PLAT_ORDER = ['抖音', '小红书', '淘宝'];
  function platRank(p) {
    var i = PLAT_ORDER.indexOf(p);
    return i < 0 ? PLAT_ORDER.length : i;
  }
  function sortByPlatform(list) {
    return list.sort(function(a, b){ return platRank(a.platform) - platRank(b.platform); });
  }

  function getTodayTasks(includeHidden) {
    var t = todayStr();
    var hidden = includeHidden ? [] : lsGetHidden();
    var list = [];
    state.tasks.forEach(function(task) {
      if (hidden.indexOf(task._id) >= 0) return;
      if (!task.planDate) {
        // 没填日期的任务也显示在今日，避免「凭空消失」
        list.push(Object.assign({}, task, { overdue: false }));
        return;
      }
      // dayDiff(今天, 计划日期)：>0 = 计划日期在过去，<0 = 计划日期在未来
      var diff = dayDiff(t, task.planDate);
      if (diff === 0) {
        list.push(Object.assign({}, task, { overdue: false }));
      } else if (diff > 0 && task.status !== '已完成') {
        // 以前没做完的：继续搬到今天来做，但不再标红、不再显示「逾期顺延」
        list.push(Object.assign({}, task, { overdue: false, planDate: t }));
      }
      // 明天及以后（diff < 0）不进今日栏，交给「备忘录」，避免上下重复
    });
    // 按平台顺序排：抖音 → 小红书 → 淘宝；同平台内保持录入顺序，未完成的自然在前
    return sortByPlatform(list);
  }

  // 排在未来日期、未完成的任务：在今日页单独一组显示，避免「新建了却找不到」
  function getFutureTasks() {
    var t = todayStr();
    var future = [];
    state.tasks.forEach(function(task) {
      if (!task.planDate || task.status === '已完成') return;
      if (dayDiff(t, task.planDate) < 0) future.push(Object.assign({}, task, { future: true }));
    });
    future.sort(function(a, b) { return a.planDate < b.planDate ? -1 : 1; });
    return future;
  }

  function getFilteredTasks() {
    var list = state.tasks.slice();
    if (state.platformFilter !== 'all') list = list.filter(function(t){ return t.platform === state.platformFilter; });
    list.sort(function(a, b) {
      // sort by planDate desc, then platform
      if (a.planDate < b.planDate) return 1;
      if (a.planDate > b.planDate) return -1;
      return 0;
    });
    return list;
  }

  function getWeekStats() {
    var t = todayStr();
    var monday = startOfWeek(t);
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(monday, i));
    var byDay = {};
    days.forEach(function(d){ byDay[d] = { total: 0, done: 0 }; });
    var byPlat = {};
    PLATFORMS.forEach(function(p){ byPlat[p] = { total: 0, done: 0, progressSum: 0, progressCount: 0 }; });

    state.tasks.forEach(function(task) {
      if (!task.planDate) return;
      if (days.indexOf(task.planDate) >= 0) {
        byDay[task.planDate].total++;
        if (task.status === '已完成') byDay[task.planDate].done++;
      }
      // platform stats: all tasks of this platform planned within Mon..Sun
      if (task.planDate >= monday && task.planDate <= days[6]) {
        var ps = byPlat[task.platform];
        if (ps) {
          ps.total++;
          if (task.status === '已完成') ps.done++;
          ps.progressSum += task.progress;
          ps.progressCount++;
        }
      }
    });

    var totalTasks = 0, totalDone = 0;
    PLATFORMS.forEach(function(p){
      var ps = byPlat[p];
      ps.avg = ps.progressCount ? Math.round(ps.progressSum / ps.progressCount) : 0;
      totalTasks += ps.total; totalDone += ps.done;
    });
    return { days: days, byDay: byDay, byPlat: byPlat, totalTasks: totalTasks, totalDone: totalDone };
  }

  // =================== RENDER LAYER ===================
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'style') e.style.cssText = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e[k] = attrs[k];
      else if (k === 'data') {
        for (var dk in attrs[k]) e.dataset[dk] = attrs[k][dk];
      } else e.setAttribute(k, attrs[k]);
    }
    if (children) children.forEach(function(c){ if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function clearEl(e) { while (e.firstChild) e.removeChild(e.firstChild); }

  }

  // 备忘录的一行：只有名称 / 备注 / 配图张数，点开可编辑
  function buildMemoItemRow(m) {
    var row = el('div', { class: 'memo-row simple' });

    body.appendChild(el('div', { class: 'memo-name' }, [m.title || '(没写名称)']));

    row.appendChild(el('span', { class: 'memo-chev' }, ['\u203A']));

    // 短按 → 打开只读详情页；长按 → 删除
    var pressTimer = null, longPressed = false, moved = false;
    row.addEventListener('touchstart', function(){
      moved = false; longPressed = false;
      pressTimer = setTimeout(function(){
        if (moved) return;
        longPressed = true;
        confirmDeleteMemo(m);
      }, 600);
    }, { passive: true });
    row.addEventListener('touchmove', function(){ moved = true; clearTimeout(pressTimer); }, { passive: true });
    row.addEventListener('touchend', function(){ clearTimeout(pressTimer); }, { passive: true });
    row.addEventListener('touchcancel', function(){ clearTimeout(pressTimer); }, { passive: true });
    row.addEventListener('click', function(){
      if (longPressed) { longPressed = false; return; }
      openMemoDetail(m);
    });

  // 新增/编辑备忘（弹窗里可删除）
  function openMemoForm(memo) {
    var mask = document.getElementById('memoMask');
    var titleInput = document.getElementById('memoTitle');
    var noteInput = document.getElementById('memoNote');
    var imgGrid = document.getElementById('memoImgGrid');
    var imgCount = document.getElementById('memoImgCount');
    var pickBtn = document.getElementById('memoPickImg');
    var picker = document.getElementById('memoFilePicker');
    var delBtn = document.getElementById('memoDelete');
    var isNew = !memo;

    document.getElementById('memoModalTitle').textContent = isNew ? '新增备忘' : '编辑备忘';
    titleInput.value = memo ? (memo.title || '') : '';
    noteInput.value = memo ? (memo.note || '') : '';

    var imgs = memo ? getImages(memo._id).slice() : [];

    function renderImgs() {
      clearEl(imgGrid);
      imgCount.textContent = '（' + imgs.length + ' 张）';
      imgs.forEach(function(src, idx) {
        var t = el('div', { class: 'thumb' });
        var im = el('img', { src: src });
        im.addEventListener('click', function(){ openZoom(imgs, idx); });
        var x = el('span', { class: 'x' }, ['\u00D7']);
        x.addEventListener('click', function(e){ e.stopPropagation(); imgs.splice(idx, 1); renderImgs(); });
        t.appendChild(im); t.appendChild(x);
        imgGrid.appendChild(t);
      });
      var add = el('div', { class: 'thumb add-img', style: 'border:1px dashed var(--c-line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--c-sub);' }, ['\uFF0B']);
      add.addEventListener('click', function(){ picker.click(); });
      imgGrid.appendChild(add);
    }
    renderImgs();

    pickBtn.onclick = function(){ picker.click(); };
    picker.onchange = function(e) {
      var files = Array.from(e.target.files || []);
      picker.value = '';
      if (!files.length) return;
      var picked = files;
      var done = 0;
      pickBtn.textContent = '处理中...';
      picked.forEach(function(f) {
        var finish = function(dataUrl) {
          if (dataUrl) imgs.push(dataUrl);
          done++;
          if (done === picked.length) {
            renderImgs();
            pickBtn.textContent = '＋ 添加图片（可多选）';
            toast('已加 ' + picked.length + ' 张图');
          }
        };
        try { compress(f, 1280, finish, 0.78); } catch (err) { finish(''); }
      });
    };

    delBtn.style.display = isNew ? 'none' : '';
    delBtn.onclick = isNew ? null : function(){
      if (!confirm('确定删掉这条备忘？删了就找不回来了')) return;
      var arr = lsGetMemos().filter(function(x){ return x._id !== memo._id; });
      lsSetMemos(arr);
      setImages(memo._id, []);
      state.memos = arr;
      mask.classList.remove('show');
      refreshAll();
      toast('已删除');
    };

    document.getElementById('memoCancel').onclick = function(){ mask.classList.remove('show'); };
    document.getElementById('memoSave').onclick = function(){
      var title = titleInput.value.trim();
      if (!title && !imgs.length) { toast('至少写个名称'); return; }
      var arr = lsGetMemos();
      var rec;
      if (isNew) {
        rec = { _id: 'm_' + Date.now() + Math.random().toString(36).slice(2, 6), title: title, note: noteInput.value, createdAt: Date.now() };
        arr.push(rec);
      } else {
        rec = arr.filter(function(x){ return x._id === memo._id; })[0];
        if (!rec) { rec = { _id: memo._id, createdAt: memo.createdAt || Date.now() }; arr.push(rec); }
        rec.title = title;
        rec.note = noteInput.value;
      }
      lsSetMemos(arr);
      setImages(rec._id, imgs.slice());
      state.memos = lsGetMemos();
      mask.classList.remove('show');
      refreshAll();
      toast(isNew ? '已定稿，不能再改了' : '已保存');
    };

    mask.classList.add('show');
    setTimeout(function(){ titleInput.focus(); }, 50);
  }

  // ---------- 备忘录：删除 / 全屏只读详情页 / 大图浏览 ----------
  function fmtMemoTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function(n){ return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function confirmDeleteMemo(m) {
    if (!confirm('确定删掉「' + (m.title || '这条备忘') + '」？删了就找不回来了')) return;
    try {
      var arr = lsGetMemos().filter(function(x){ return x._id !== m._id; });
      lsSetMemos(arr);
      setImages(m._id, []);
      state.memos = arr;
    } catch (err) {}
    var box = document.getElementById('memoDetail');
    if (box) box.classList.remove('show');
    refreshAll();
    toast('已删除');
  }

  function openZoom(imgs, idx) {
    var mask = document.getElementById('zoomMask');
    var gal = document.getElementById('zoomGal');
    var ctr = document.getElementById('zoomCtr');
    clearEl(gal);
    imgs.forEach(function(src){
      var s = el('div', { class: 'zoom-slide' });
      s.appendChild(el('img', { src: src }));
      gal.appendChild(s);
    });
    var jump = function(){
      if (gal.clientWidth) gal.scrollLeft = idx * gal.clientWidth;
    };
    jump();
    ctr.textContent = (idx + 1) + ' / ' + imgs.length;
    gal.onscroll = function(){
      if (!gal.clientWidth) return;
      var i = Math.round(gal.scrollLeft / gal.clientWidth) + 1;
      if (i < 1) i = 1;
      if (i > imgs.length) i = imgs.length;
      ctr.textContent = i + ' / ' + imgs.length;
    };
    document.getElementById('zoomClose').onclick = function(){ mask.classList.remove('show'); };
    mask.classList.add('show');
    setTimeout(jump, 40);
  }

  function renderWeek() {
    if (state.currentTab !== 'week') return;
    var content = document.getElementById('tabContent');
    clearEl(content);

    var avg = (function(){
      var totP = 0, cnt = 0;

      });
      return c;
    })();
    statGrid.appendChild(makeStat(oc, '逾期未完成'));
    wrap.appendChild(statGrid);

  function progressRing(pct) {
    var r = 22, c = 50, sz = 64;
    var circ = 2 * Math.PI * r;
    var off = circ * (1 - pct / 100);
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','ring'); svg.setAttribute('width', sz); svg.setAttribute('height', sz); svg.setAttribute('viewBox', '0 0 ' + c + ' ' + c);
    var c1 = document.createElementNS('http://www.w3.org/2000/svg','circle'); c1.setAttribute('cx', c/2); c1.setAttribute('cy', c/2); c1.setAttribute('r', r); c1.setAttribute('fill','none'); c1.setAttribute('stroke','#E5E7EB'); c1.setAttribute('stroke-width','6'); svg.appendChild(c1);
    var c2 = document.createElementNS('http://www.w3.org/2000/svg','circle'); c2.setAttribute('cx', c/2); c2.setAttribute('cy', c/2); c2.setAttribute('r', r); c2.setAttribute('fill','none'); c2.setAttribute('stroke', pct >= 100 ? '#16A34A' : '#5B6FFF'); c2.setAttribute('stroke-width','6'); c2.setAttribute('stroke-linecap','round'); c2.setAttribute('stroke-dasharray', circ); c2.setAttribute('stroke-dashoffset', off); c2.setAttribute('transform','rotate(-90 ' + c/2 + ' ' + c/2 + ')'); svg.appendChild(c2);
    return svg;
  }

      clearEl(imgGrid);

      });

        add.addEventListener('click', function(){ fldPicker.click(); });

      }

    }
    renderFormImages();

    pickBtn.onclick = function(){ fldPicker.click(); };
    fldPicker.onchange = function(e) {
      var files = Array.from(e.target.files || []);
      fldPicker.value = '';
      if (!files.length) return;
      var room = 9 - state.formImages.length;
      if (room <= 0) { toast('最多 9 张'); return; }
      var picked = files.slice(0, room);
      var done = 0;
      pickBtn.textContent = '处理中...';
      picked.forEach(function(f) {
        var finish = function(dataUrl) {
          if (dataUrl) state.formImages.push(dataUrl);
          done++;
          if (done === picked.length) {
            renderFormImages();
            pickBtn.textContent = '＋ 添加图片（可多选）';
            toast('已加 ' + picked.length + ' 张图');
          }
        };
        try { compress(f, 800, finish); } catch (err) { finish(''); }
      });
    };

    // Fill platform options on first open (once)
    if (!platSel.options.length) {
      PLATFORMS.forEach(function(p){ var o = document.createElement('option'); o.value = p; o.textContent = p; platSel.appendChild(o); });
    }
    if (!stSel.options.length) {
      STATUSES.forEach(function(s){ var o = document.createElement('option'); o.value = s; o.textContent = s; stSel.appendChild(o); });
    }

    nameInput.value = rec.taskName || '';
    platSel.value = rec.platform || '小红书';
    stSel.value = rec.status || '未开始';
    progRange.value = String(typeof rec.progress === 'number' ? rec.progress : 0);
    progLabel.textContent = progRange.value + '%';
    progBar.style.width = progRange.value + '%';
    progBar.style.background = parseInt(progRange.value,10) >= 100 ? 'var(--c-ok)' : 'var(--c-brand)';
    dateInput.value = rec.planDate || todayStr();
    noteInput.value = rec.note || '';

    var updateProg = function(){
      progLabel.textContent = progRange.value + '%';
      progBar.style.width = progRange.value + '%';
      progBar.style.background = parseInt(progRange.value,10) >= 100 ? 'var(--c-ok)' : 'var(--c-brand)';
    };
    progRange.oninput = updateProg;
    stSel.onchange = function(){
      if (stSel.value === '已完成') { progRange.value = 100; updateProg(); }
    };

    var saveBtn = document.getElementById('fldSave');
    var cancelBtn = document.getElementById('fldCancel');
    var onSave = function(){
      if (!nameInput.value.trim()) { toast('任务名称不能为空'); return; }
      if (!dateInput.value) { toast('请选个日期'); return; }
      saveRecord({
        taskName: nameInput.value.trim(),
        platform: platSel.value,
        status: stSel.value,
        progress: parseInt(progRange.value, 10),
        planDate: dateInput.value,
        note: noteInput.value.trim()
      }, rec._id).then(function(savedId){
        if (savedId) setImages(savedId, state.formImages);
        return loadAll();
      }).then(function(){
        mask.classList.remove('show');
        refreshAll();
        toast(isNew ? '已添加' : '已保存');
      });
    };
    var onCancel = function(){ mask.classList.remove('show'); };
    saveBtn.onclick = onSave;
    cancelBtn.onclick = onCancel;

    // 编辑已有任务时显示「删除」；新增时隐藏
    var delBtn = document.getElementById('fldDelete');
    if (isNew || !rec._id) {
      delBtn.style.display = 'none';
      delBtn.onclick = null;
    } else {
      delBtn.style.display = '';
      delBtn.onclick = function(){
        if (!confirm('确定删除这条任务？删了就找不回来了')) return;
        mask.classList.remove('show');

          setImages(rec._id, []);

          lsSetHidden(lsGetHidden().filter(function(i){ return i !== rec._id; }));
          refreshAll();
          toast('已删除');
        });
      };
    }

    mask.classList.add('show');
    setTimeout(function(){ nameInput.focus(); }, 50);
  }

  function compress(file, maxW, cb, q) {
    var finished = false;
    var once = function(v){ if (!finished) { finished = true; cb(v); } };
    setTimeout(function(){ once(''); }, 10000); // 兜底：解码卡住时不阻塞界面
    var reader = new FileReader();
    reader.onerror = function(){ once(''); };
    reader.onload = function(evt){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        if (!ctx) { once(''); return; }
        ctx.drawImage(img, 0, 0, w, h);
        once(c.toDataURL('image/jpeg', q || 0.7));
      };
      img.onerror = function(){ once(''); };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Import / Export
  function exportData() {
    var imgs = lsGetImgs();

  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.addEventListener('change', function(){
      var f = inp.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = async function(evt){
        try {
          var data = JSON.parse(evt.target.result);
          if (!data.tasks || !Array.isArray(data.tasks)) throw new Error('文件格式不对');
          if (!confirm('导入 ' + data.tasks.length + ' 条任务？现有的不会被删，导入的将作为新条目添加')) return;
          var imgs = lsGetImgs();
          for (var i = 0; i < data.tasks.length; i++) {
            var t = data.tasks[i];
            var newId = await saveRecord({
              taskName: t.taskName || '', platform: t.platform || '小红书',
              status: t.status || '未开始', progress: t.progress || 0,
              planDate: t.planDate || todayStr(), note: t.note || ''
            }, null);
            if (newId && t.images && t.images.length) imgs[newId] = t.images;
          }
          if (Array.isArray(data.memos) && data.memos.length) {
            var memos = lsGetMemos();
            data.memos.forEach(function(m){
              memos.push({ _id: m._id || ('m_' + Date.now() + Math.random().toString(36).slice(2, 6)),
                           title: m.title || '', note: m.note || '', createdAt: m.createdAt || Date.now() });
              if (m.images && m.images.length) imgs[m._id] = m.images;
            });
            lsSetMemos(memos);
            state.memos = lsGetMemos();
          }
          lsSetImgs(imgs);
          await loadAll();
          refreshAll();
          toast('已导入 ' + data.tasks.length + ' 条任务' +
                (Array.isArray(data.memos) && data.memos.length ? '、' + data.memos.length + ' 条备忘' : ''));
        } catch(e) {
          toast('导入失败：' + e.message);
        }
      };
      reader.readAsText(f);
    });
    inp.click();
  }

  // =================== BOOT ===================
  // 每一步都独立容错：云端失败也要保证界面能渲染出来
  async function safe(fn, label) {
    try { await fn(); } catch (e) { console.error('[boot:' + label + ']', e); }
  }

  async function boot() {
    await safe(loadOptions, 'options');
    try { state.memos = lsGetMemos(); } catch (e) {}
    await safe(loadAll, 'load');
    if (!state.tasks.length) {
      await safe(seedIfEmpty, 'seed');
      await safe(loadAll, 'reload');
    }
    try { refreshAll(); } catch (e) { console.error('[boot:render]', e); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
